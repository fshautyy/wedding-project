name: Deploy Laravel to GitHub Pages

on:
  push:
    branches: [ main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, mysql, curl
        coverage: none

    - name: Copy .env
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Install dependencies
      run: composer install --no-dev --optimize-autoloader

    - name: Build assets (if using Vite/Mix)
      run: |
        npm ci
        npm run build

    - name: Generate static assets for GitHub Pages
      run: |
        # Hapus folder build sebelumnya
        rm -rf public/build
        
        # Copy assets yang diperlukan
        mkdir -p public/build
        cp -r public/css public/build/ || true
        cp -r public/js public/build/ || true
        cp -r public/images public/build/ || true
        cp public/mix-manifest.json public/build/ || true
        cp public/.htaccess public/build/ || true

    - name: Setup Pages
      uses: actions/configure-pages@v3

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v2
      with:
        path: './public'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2
